name: 💡 Idea or improvement
description: Suggest a new feature or a way to make something better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: Describe what you'd like the app to do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What problem does it solve, or what would it make easier?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mock-ups, examples from other apps, screenshots…
